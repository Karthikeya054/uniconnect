<!DOCTYPE html>
<html>
<head><title>Generate Icons</title></head>
<body>
<p>Open this in a browser, right-click each canvas, and "Save Image As" to create the icon PNGs.</p>

<h3>16x16</h3>
<canvas id="c16" width="16" height="16"></canvas>

<h3>48x48</h3>
<canvas id="c48" width="48" height="48"></canvas>

<h3>128x128</h3>
<canvas id="c128" width="128" height="128"></canvas>

<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;

  // Background circle
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI * 2);
  ctx.fillStyle = '#4f46e5';
  ctx.fill();

  // Video camera icon
  ctx.fillStyle = 'white';
  ctx.strokeStyle = 'white';
  ctx.lineWidth = s * 0.06;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Camera body
  const bx = s * 0.15, by = s * 0.3;
  const bw = s * 0.45, bh = s * 0.4;
  const br = s * 0.06;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, br);
  ctx.fill();

  // Camera lens triangle
  ctx.beginPath();
  ctx.moveTo(bx + bw, s * 0.35);
  ctx.lineTo(s * 0.85, s * 0.25);
  ctx.lineTo(s * 0.85, s * 0.75);
  ctx.lineTo(bx + bw, s * 0.65);
  ctx.fill();

  // Recording dot
  ctx.beginPath();
  ctx.arc(s * 0.78, s * 0.78, s * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = '#ef4444';
  ctx.fill();
}

drawIcon(document.getElementById('c16'));
drawIcon(document.getElementById('c48'));
drawIcon(document.getElementById('c128'));
</script>
</body>
</html>
