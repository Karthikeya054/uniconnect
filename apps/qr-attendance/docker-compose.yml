version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: qr_attendance
      POSTGRES_USER: attend
      POSTGRES_PASSWORD: ${DB_PASSWORD:-attendpass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attend"]
      interval: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://USER:PASSWORD@db:5432/qr_attendance
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
    ports:
      - "3001:3001"

volumes:
  pgdata:
